model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  revision: null
  dtype: bfloat16
  trust_remote_code: false
data:
  train_file: data/processed/gsm8k_sft.jsonl
  validation_file: data/processed/gsm8k_validation.jsonl
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
training:
  output_dir: checkpoints/smoke/sft
  results_dir: results/smoke/sft
  epochs: 1
  learning_rate: 1.0e-4
  lr_scheduler_type: linear
  optimizer: adamw_torch_fused
  warmup_ratio: 0.0
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1
  max_length: 512
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 1
  eval_steps: 5
  save_steps: 5
  save_total_limit: 1
  gradient_checkpointing: true
  tf32: true
  completion_only_loss: true
  eos_token: <|im_end|>
  packing: false
  shuffle_dataset: true
  seed: 42
