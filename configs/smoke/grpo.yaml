model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  revision: null
  dtype: bfloat16
  trust_remote_code: false
data:
  train_file: data/processed/gsm8k_rl.jsonl
source_checkpoint: checkpoints/smoke/sft
training:
  output_dir: checkpoints/smoke/grpo
  results_dir: results/smoke/grpo
  learning_rate: 1.0e-5
  lr_scheduler_type: linear
  optimizer: adamw_torch_fused
  warmup_ratio: 0.0
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  max_steps: 1
  logging_steps: 1
  save_steps: 1
  save_total_limit: 1
  max_grad_norm: 1.0
  gradient_checkpointing: true
  tf32: true
  seed: 42
grpo:
  generations_per_prompt: 4
  max_prompt_length: 512
  max_completion_length: 64
  temperature: 0.8
  beta: 0.0
  loss_type: grpo
  scale_rewards: group
  epsilon: 0.2
  num_iterations: 1
  mask_truncated_completions: false
  max_gpu_hours: 0.25
  use_vllm: false
logging:
  save_generations: true
  reward_groups_file: results/smoke/grpo/reward_groups.jsonl
  rollouts_file: generations/smoke/grpo/rollouts.jsonl
