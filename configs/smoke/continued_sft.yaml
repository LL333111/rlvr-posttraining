model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  revision: null
  dtype: bfloat16
  trust_remote_code: false
data:
  train_file: data/processed/gsm8k_sft.jsonl
  validation_file: data/processed/gsm8k_validation.jsonl
source_checkpoint: checkpoints/smoke/sft
compute:
  match_metadata: results/smoke/grpo/run_metadata.json
  fallback_max_gpu_hours: 0.05
training:
  output_dir: checkpoints/smoke/continued_sft
  results_dir: results/smoke/continued_sft
  max_steps: 1
  learning_rate: 1.0e-4
  lr_scheduler_type: linear
  optimizer: adamw_torch_fused
  warmup_steps: 0
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 1
  max_length: 512
  weight_decay: 0.0
  max_grad_norm: 1.0
  logging_steps: 1
  eval_steps: 1
  save_steps: 1
  save_total_limit: 1
  gradient_checkpointing: true
  tf32: true
  completion_only_loss: true
  eos_token: <|im_end|>
  packing: false
  shuffle_dataset: true
  seed: 42
