model:
  name: Qwen/Qwen2.5-1.5B-Instruct
  revision: null
  dtype: bfloat16
  trust_remote_code: false
data:
  train_file: data/processed/gsm8k_rl.jsonl
source_checkpoint: checkpoints/sft
training:
  output_dir: checkpoints/grpo
  results_dir: results/grpo
  learning_rate: 1.0e-5
  lr_scheduler_type: linear
  optimizer: adamw_torch_fused
  warmup_steps: 25
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  max_steps: 500
  logging_steps: 1
  save_steps: 25
  save_total_limit: 2
  max_grad_norm: 1.0
  gradient_checkpointing: true
  tf32: true
  seed: 42
grpo:
  generations_per_prompt: 4
  max_prompt_length: 512
  max_completion_length: 512
  temperature: 0.8
  beta: 0.0
  loss_type: grpo
  scale_rewards: group
  epsilon: 0.2
  num_iterations: 1
  mask_truncated_completions: false
  max_gpu_hours: 3.0
  use_vllm: false
logging:
  save_generations: true
  reward_groups_file: results/grpo/reward_groups.jsonl
  rollouts_file: generations/grpo/rollouts.jsonl
