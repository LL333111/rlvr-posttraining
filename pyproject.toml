[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rlvr-posttraining"
version = "0.1.0"
description = "Compute-matched verifier-guided post-training for small language models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
  "accelerate>=1.12,<2",
  "datasets>=4.7,<5",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "peft>=0.19,<1",
  "pyyaml>=6.0,<7",
  "safetensors>=0.5,<1",
  "torch>=2.7,<3",
  "transformers>=5.12,<6",
  "trl==1.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
